
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17191d"></stop>
      <stop offset="55%" stop-color="#08090c"></stop>
      <stop offset="100%" stop-color="#25040a"></stop>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="35%" stop-color="#c9cbd0"></stop>
      <stop offset="65%" stop-color="#73777e"></stop>
      <stop offset="100%" stop-color="#f4f4f4"></stop>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff596b"></stop>
      <stop offset="50%" stop-color="#d7192d"></stop>
      <stop offset="100%" stop-color="#720716"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="3" y="3" width="122" height="122" rx="24" fill="url(#bg)" stroke="#a80d22" stroke-width="2"></rect>

  <!-- Red glow -->
  <circle cx="64" cy="67" r="42" fill="#b20c24" opacity=".13"></circle>

  <!-- Crown -->
  <g fill="url(#red)" stroke="#ff6977" stroke-width="1.3">
    <path d="M37 42 L29 20 L48 32 L64 12 L80 32 L99 20 L91 42 Z"></path>
    <path d="M37 42 H91 L86 51 H42 Z"></path>
  </g>

  <!-- Crown jewels -->
  <g fill="#fff0c8">
    <circle cx="29" cy="20" r="2.5"></circle>
    <circle cx="64" cy="12" r="3"></circle>
    <circle cx="99" cy="20" r="2.5"></circle>
  </g>

  <path d="M48 32 L64 42 L80 32" fill="none" stroke="#ffb4bb" stroke-width="1.5"></path>

  <!-- Letter K -->
  <path d="M35 48 H48 V68 L75 48 H94 L66 69 L96 103 H77 L56 78 L48 85 V103 H35 Z" fill="url(#silver)" stroke="#ffffff" stroke-width=".7"></path>

  <!-- Red heart -->
  <path d="M64 111
           C59 105 50 100 50 94
           C50 86 60 83 64 91
           C68 83 78 86 78 94
           C78 100 69 105 64 111Z" fill="url(#red)" filter="url(#glow)"></path>

  <!-- Bottom detail -->
  <path d="M19 117 H109" stroke="#d7192d" stroke-width="1" opacity=".7"></path>
</svg>
